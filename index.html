<!DOCTYPE html>
<html lang="ja">
<!-- 2, htmlにcanvasタグ、6, 345, 1 -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <title>Carry It</title>
    <script>
        "use strict";
        // 迷路データ（0：通路、1：目的地、2：荷物、6：壁 ）
        const data = [
            [6, 6, 6, 6, 6, 6, 6, 6, 6, 6, 6],
            [6, 6, 6, 0, 0, 6, 6, 6, 6, 6, 6],
            [6, 6, 6, 2, 0, 6, 6, 6, 6, 6, 6],
            [6, 6, 6, 0, 0, 0, 0, 6, 6, 6, 6],
            [6, 6, 6, 0, 6, 6, 0, 6, 6, 6, 6],
            [6, 0, 0, 2, 0, 0, 2, 0, 2, 0, 6],
            [6, 0, 6, 0, 6, 6, 0, 0, 0, 0, 6],
            [6, 0, 6, 0, 6, 6, 0, 2, 0, 0, 6],
            [6, 0, 6, 0, 6, 6, 2, 6, 6, 6, 6],
            [6, 0, 6, 0, 0, 0, 0, 6, 6, 6, 6],
            [6, 0, 0, 0, 6, 6, 6, 6, 6, 6, 6],
            [6, 6, 6, 0, 6, 6, 6, 6, 6, 6, 6],
            [6, 6, 0, 0, 6, 6, 6, 6, 6, 6, 6],
            [6, 6, 6, 0, 6, 6, 6, 6, 6, 6, 6],
            [6, 6, 0, 0, 0, 6, 6, 6, 6, 6, 6],
            [6, 6, 0, 0, 0, 6, 6, 6, 6, 6, 6],
            [6, 6, 1, 1, 1, 6, 6, 6, 6, 6, 6],
            [6, 6, 1, 1, 1, 6, 6, 6, 6, 6, 6],
            [6, 6, 6, 6, 6, 6, 6, 6, 6, 6, 6],
            [6, 6, 6, 6, 6, 6, 6, 6, 6, 6, 6],
        ];

        let gc = null;
        let px = 2;
        let py = 12;
        let isClear = false;

        window.onload = () => {
            gc = document.getElementById("soko").getContext("2d");
            window.onkeydown = mykeydown;
            repaint();

            const left = document.getElementById("left");
            const up = document.getElementById("up");
            const right = document.getElementById("right");
            const down = document.getElementById("down");

            left.addEventListener("pointerdown", () => {
                const keyEvent = new KeyboardEvent("keydown", {
                    key: "ArrowLeft",
                    code: "ArrowLeft",
                    keyCode: 37,
                    bubbles: true
                });
                window.dispatchEvent(keyEvent);
            });
            up.addEventListener("pointerdown", () => {
                const keyEvent = new KeyboardEvent("keydown", {
                    key: "ArrowUp",
                    code: "ArrowUp",
                    keyCode: 38,
                    bubbles: true
                });
                window.dispatchEvent(keyEvent);
            });
            right.addEventListener("pointerdown", () => {
                const keyEvent = new KeyboardEvent("keydown", {
                    key: "ArrowRight",
                    code: "ArrowRight",
                    keyCode: 39,
                    bubbles: true
                });
                window.dispatchEvent(keyEvent);
            });
            down.addEventListener("pointerdown", () => {
                const keyEvent = new KeyboardEvent("keydown", {
                    key: "ArrowDown",
                    code: "ArrowDown",
                    keyCode: 40,
                    bubbles: true
                });
                window.dispatchEvent(keyEvent);
            });
        };

        function mykeydown(e){
            if(isClear){
                return;
            }
            let dx0 = px;
            let dy0 = py;
            let dx1 = px;
            let dy1 = py;

            switch(e.keyCode){
                case 37:
                    dx0--;
                    dx1-=2;
                    break;
                case 38:
                    dy0--;
                    dy1-=2;
                    break;
                case 39:
                    dx0++;
                    dx1+=2;
                    break;
                case 40:
                    dy0++;
                    dy1+=2;
                    break;
            }

            if ((data[dy0][dx0] & 0x2) == 0){
                px = dx0;
                py = dy0;
            } else if ((data[dy0][dx0] & 0x6) == 2){
                if((data[dy1][dx1] & 0x2) == 0){
                    data[dy0][dx0] ^= 2;
                    data[dy1][dx1] |= 2;
                    px = dx0;
                    py = dy0;
                }
            }

            isClear = checkClear();

            isClear ? drawClearScreen() : repaint();
        }

        function checkClear () {
            let isClear;
            for(let y=0; y<data.length; y++){
                for(let x=0; x<data[y].length; x++){
                    if(data[y][x] == 2 || data[y][x] == 1){
                        return false;
                    }
                }
            }
            return true;
        }

        function repaint(){
            gc.fillStyle = "black";
            gc.fillRect(0, 0, 440, 800);

            for(let y=0; y<data.length; y++){
                for(let x=0; x<data[y].length; x++){
                    if(data[y][x] & 0x1){
                        gc.drawImage(imgGoal, x*40, y*40, 40, 40);
                    }
                    if(data[y][x] & 0x2){
                        gc.drawImage(imgLuggage, x*40, y*40, 40, 40);
                    }
                    if(data[y][x] == 6){
                        gc.drawImage(imgWall, x*40, y*40, 40, 40);
                    }
                }
            }
            gc.drawImage(imgWorker, px*40, py*40, 40, 40)

            gc.font = "24px 'sans-serif'";
            gc.fillText("荷物を押して運ぼう", 216, 480);
        }

        function drawClearScreen(){
            gc.clearRect(0, 0, 440, 800);
            for(let y=0; y<data.length; y++){
                for(let x=0; x<data[y].length; x++){
                    gc.drawImage(imgWall, x*40, y*40, 40, 40);
                }
            }

            gc.font = "48px 'sans-serif'";
            gc.fillText("Good job!", 110, 320);

            document.getElementById("btnWrapper").classList.add("none");
        }
    </script>
</head>
<body>
    <div class="container">
        <canvas id="soko" width="440" height="800"></canvas>
        <div class="btnWrapper" id="btnWrapper">
            <button class="btn left" id="left">←</button>
            <button class="btn up" id="up">↑</button>
            <button class="btn right" id="right">→</button>
            <button class="btn down" id="down">↓</button>
        </div>
    </div>

    <img id="imgWall" src="imgWall.png" style="display: none;">
    <img id="imgGoal" src="imgGoal.png" style="display: none;">
    <img id="imgWorker" src="imgWorker.png" style="display: none;">
    <img id="imgLuggage" src="imgLuggage.png" style="display: none;">
</body>
</html>
